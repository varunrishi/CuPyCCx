name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libeigen3-dev

      - name: Install build backend
        run: pip install scikit-build-core pybind11

      - name: Build and install cupyccx
        run: |
          pip install -e ".[dev]" \
            -C cmake.define.Eigen3_DIR=/usr/share/eigen3/cmake \
            -C cmake.build-type=Release

      - name: Run tests
        run: python -m pytest tests/python/ -v
        env:
          EIGEN3_DIR: /usr/share/eigen3/cmake
