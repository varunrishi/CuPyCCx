<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <!-- Orbital ring gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#ab47bc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#4fc3f7"/>
      <stop offset="35%"  style="stop-color:#81d4fa"/>
      <stop offset="65%"  style="stop-color:#ce93d8"/>
      <stop offset="100%" style="stop-color:#ab47bc"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill -->
  <rect width="480" height="160" rx="18" ry="18" fill="url(#bgGrad)"/>

  <!-- ── Atom icon (left side) ── -->
  <g transform="translate(78,80)">
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="8" fill="#ab47bc" filter="url(#softglow)" opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="#ce93d8"/>

    <!-- Orbital ring 1 (equatorial) -->
    <ellipse cx="0" cy="0" rx="36" ry="12"
             fill="none" stroke="url(#orbitGrad)" stroke-width="1.8"
             filter="url(#glow)" opacity="0.85"/>

    <!-- Orbital ring 2 (tilted 60°) -->
    <ellipse cx="0" cy="0" rx="36" ry="12"
             fill="none" stroke="url(#orbitGrad)" stroke-width="1.8"
             transform="rotate(60)" filter="url(#glow)" opacity="0.85"/>

    <!-- Orbital ring 3 (tilted 120°) -->
    <ellipse cx="0" cy="0" rx="36" ry="12"
             fill="none" stroke="url(#orbitGrad)" stroke-width="1.8"
             transform="rotate(120)" filter="url(#glow)" opacity="0.85"/>

    <!-- Electron dots -->
    <circle cx="36" cy="0"   r="3.5" fill="#4fc3f7" filter="url(#softglow)"/>
    <circle cx="-18" cy="31" r="3.5" fill="#ab47bc" filter="url(#softglow)"/>
    <circle cx="-18" cy="-31" r="3.5" fill="#81d4fa" filter="url(#softglow)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Cu" in cyan -->
  <text x="140" y="98"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="-1"
        fill="#4fc3f7" filter="url(#glow)">Cu</text>

  <!-- "Py" in lighter blue-purple -->
  <text x="212" y="98"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="-1"
        fill="#ce93d8" filter="url(#glow)">Py</text>

  <!-- "CC" in bold -->
  <text x="285" y="98"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" letter-spacing="-1"
        fill="#f3e5f5">CC</text>

  <!-- "x" subscript-style, slightly smaller and shifted up -->
  <text x="383" y="105"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800"
        fill="#ab47bc" filter="url(#glow)">x</text>

  <!-- Tagline -->
  <text x="140" y="125"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="400" letter-spacing="2.5"
        fill="#546e7a" text-anchor="start">COUPLED CLUSTER · C++ · CUDA · PYTHON</text>

  <!-- Bottom accent line -->
  <line x1="140" y1="133" x2="430" y2="133"
        stroke="url(#orbitGrad)" stroke-width="1.2" opacity="0.4"/>
</svg>
