<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 85" width="380" height="85">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="380" height="85" rx="12" fill="url(#bg)"/>

  <!-- Wordmark as a single text block using tspan for color segments -->
  <text x="190" y="72"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800"
        text-anchor="middle" letter-spacing="-1">
    <tspan fill="#38bdf8" filter="url(#glow)">Cu</tspan><tspan fill="#e0d4ff">Py</tspan><tspan fill="#a78bfa" filter="url(#glow)">CCx</tspan>
  </text>

</svg>
