<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="140" rx="14" fill="url(#bg)"/>

  <!-- ── Simple atom (two rings + nucleus) ── -->
  <g transform="translate(68,70)">
    <!-- Ring 1 -->
    <ellipse cx="0" cy="0" rx="32" ry="11" fill="none"
             stroke="#38bdf8" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <!-- Ring 2 (rotated 65°) -->
    <ellipse cx="0" cy="0" rx="32" ry="11" fill="none"
             stroke="#a78bfa" stroke-width="2" opacity="0.9"
             transform="rotate(65)" filter="url(#glow)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="7" fill="#a78bfa" opacity="0.95" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#e0d4ff"/>
    <!-- Two electrons -->
    <circle cx="32" cy="0"  r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-16" cy="27" r="3.5" fill="#a78bfa" filter="url(#glow)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- Cu -->
  <text x="122" y="92"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800"
        fill="#38bdf8" filter="url(#glow)">Cu</text>
  <!-- Py -->
  <text x="199" y="92"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800"
        fill="#e0d4ff">Py</text>
  <!-- CCx -->
  <text x="278" y="92"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800"
        fill="#a78bfa" filter="url(#glow)">CCx</text>

  <!-- Divider -->
  <line x1="122" y1="103" x2="430" y2="103"
        stroke="#38bdf8" stroke-width="1" opacity="0.25"/>

  <!-- Tagline — short enough to fit -->
  <text x="275" y="122"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11.5" font-weight="400" letter-spacing="2.2"
        fill="#64748b" text-anchor="middle">C++ · CUDA · PYTHON · COUPLED CLUSTER</text>
</svg>
